# Ambiente Docker local, isolado da produção: Postgres próprio e nenhuma chave real.
#   cp .env.example .env              (preencher POSTGRES_PASSWORD e JWT_SECRET)
#   docker compose up -d --build --wait
#   docker compose run --rm seed      (opcional: dados fictícios no banco do container)
name: agendamentos

x-database-url: &database-url 'postgresql://${POSTGRES_USER:-agendamentos}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (veja .env.example)}@db:5432/${POSTGRES_DB:-agendamentos}'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agendamentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-agendamentos}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: o servidor temporário do init só escuta no socket, então não conta como pronto.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  # Aplica as migrations pendentes e sai; a API só sobe depois que ele termina com sucesso.
  migrate:
    build:
      context: .
      target: api
    command: ['prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env (veja .env.example)}
      JWT_EXPIRES_IN: 12h
      APP_URL: http://localhost:${WEB_PORT:-3000}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
      SWAGGER_ENABLED: 'true'
      TRUST_PROXY: 'false'
      # Opcionais: vazios, e-mail só vai para o log e upload de foto responde 503.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      target: web
      args:
        # Vai para o bundle no build: mudou API_PORT, rode o build de novo.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Dados fictícios (profissionais, produtos, agendas). Só roda quando chamado:
  #   docker compose run --rm seed
  # Antes, crie pelo cadastro as contas admin e cliente que o seed promove (apps/api/prisma/seed.ts).
  seed:
    build:
      context: .
      target: api-build
    profiles: ['seed']
    command: ['npm', 'run', 'db:seed']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
